[package]
name = "tally"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
auto-launch = "0.6.0"
directories = "6.0.0"
global-hotkey = "0.8.0"
iced = { version = "0.14.0", features = ["tokio", "svg"] }
jiff = "0.2.37"
rfd = "0.17.2"
tally-core.workspace = true
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tray-icon = { version = "0.26.0", default-features = false, features = ["ksni"] }
user-idle = "0.6.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSRunningApplication", "std"] }
